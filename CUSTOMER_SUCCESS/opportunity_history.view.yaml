# Reference this view as customer_success__opportunity_history
schema: CUSTOMER_SUCCESS
table_name: OPPORTUNITY_HISTORY

dimensions:
  id:
    sql: '"ID"'
    format: ID
    primary_key: true

  close_date:
    sql: '"CLOSE_DATE"'

  created_date:
    sql: '"CREATED_DATE"'

  forecast_category:
    sql: '"FORECAST_CATEGORY"'

  opportunity_id:
    sql: '"OPPORTUNITY_ID"'
    format: ID

  stage_name:
    sql: '"STAGE_NAME"'

measures:
  count:
    aggregate_type: count
