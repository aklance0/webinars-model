# Reference this view as customer_success__opportunity_field_history
schema: CUSTOMER_SUCCESS
table_name: OPPORTUNITY_FIELD_HISTORY

dimensions:
  id:
    sql: '"ID"'
    format: ID
    primary_key: true

  date:
    sql: '"DATE"'

  opportunity_id:
    sql: '"OPPORTUNITY_ID"'
    format: ID

  field:
    sql: '"FIELD"'

  newvalue:
    sql: '"NEWVALUE"'

  oldvalue:
    sql: '"OLDVALUE"'

measures:
  count:
    aggregate_type: count
